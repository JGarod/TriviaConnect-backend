version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: mysql_trivia
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: trivia_db
      MYSQL_USER: trivia_user
      MYSQL_PASSWORD: triviapass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
